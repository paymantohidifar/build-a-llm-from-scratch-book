[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "llms-from-scratch"
version = "0.1.0"
description = "Personal notes on step-by-step implementation of LLMs, from scratch, in PyTorch."
authors = [
    { name = "Payman Tohidifar", email = "payman.tohidifar@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.11"
license = { text = "MIT" }

# Base dependencies for the project (CPU and GPU shared)
dependencies = [
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "tiktoken>=0.9.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.66.0",
    "importlib-metadata>=7.1.0",
    "tensorflow>=2.18.0",
    "requests>=2.28",
    "ipykernel>=7.3.0",
    "pixi-kernel>=0.1.0",
]

# Mutually Exclusive Hardware Accel Groups and Dev Utilities
[project.optional-dependencies]
cpu = ["torch==2.6.0"]
gpu = ["torch==2.6.0"]
dev = [
    "tensorflow>=2.18.0",
    "build>=1.2.2",
    "twine>=6.1.0",
    "pytest>=8.0",
    "ruff>=0.6"
]
bonus = [
    "scikit-learn>=1.3.1",
    "ipywidgets>=8.1.2",
    "blobfile>=3.0.0",
    "huggingface_hub>=0.34.4",
    "openai>=1.30.3",
    "sentencepiece>=0.1.99",
    "transformers>=5.0.0",
    "safetensors>=0.6.2",
    "thop>=0.1.1",
    "tokenizers>=0.21.1"
]

# Local packages to include in the wheel distribution
[tool.hatch.build.targets.wheel]
packages = ["src/llms_from_scratch"]

# --- UV hardware acceleration configuration ---
[tool.uv]
conflicts = [ [{ extra = "cpu" }, { extra = "gpu" }] ]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" }
]

# --- Ruff configuration ---
[tool.ruff]
line-length = 110
target-version = "py311"

# --- Pixi Configuration Hook (Read ONLY by local Pixi installations) ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tool.pixi.workspace.pypi-options]
extra-index-urls = [
    "https://download.pytorch.org/whl/cpu",
    "https://download.pytorch.org/whl/cu124"
]

[tool.pixi.dependencies]
python = "3.11.*"
ipykernel = ">=7.3.0,<8"

[tool.pixi.pypi-dependencies]
llms_from_scratch = { path = ".", editable = true }

[tool.pixi.feature.cpu.pypi-dependencies]
torch = "==2.6.0"

[tool.pixi.feature.gpu.pypi-dependencies]
torch = "==2.6.0"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[tool.pixi.environments]
default = ["cpu", "dev"] # Standard local install defaults to clean CPU + Dev
gpu-env = ["gpu", "dev"] # GPU setup activates the full CUDA framework pipeline
bonus-cpu-env = ["cpu", "bonus", "dev"] # Bonus setup activates extended ML tooling (CPU)
bonus-gpu-env = ["gpu", "bonus", "dev"] # Bonus setup activates extended ML tooling (GPU)

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
