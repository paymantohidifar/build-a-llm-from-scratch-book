[workspace]
name = "llms-from-scratch"
version = "1.0.0"
description = "Personal notes on step-by-step implementation of LLMs, from scratch, in PyTorch."
authors = ["Payman Tohidifar <payman.tohidifar@gmail.com>"]
channels = ["conda-forge"] 
platforms = ["linux-64"]

# ==========================================
# GLOBAL DEPENDENCIES
# ==========================================
[dependencies]
python = "3.11.*"
pytorch-cpu = ">=2.6.0"
tiktoken = ">=0.9.0"
matplotlib = ">=3.10.0"
tqdm = ">=4.67.1"
numpy = ">=2.0.0"
pandas = ">=3.0.0"
pixi-kernel = "*"

[pypi-dependencies]
importlib-metadata = ">=8.0.0" 

# ==========================================
# DEV TOOLING & EDITABLE MOUNTING
# ==========================================
[feature.dev.dependencies]
pytest = ">=8.3.5"
jupyterlab = ">=4.3.5"
requests = "*"

[feature.dev.pypi-dependencies]
build = ">=1.2.2"
twine = ">=6.1.0"
tokenizers = ">=0.22.0"
safetensors = ">=0.6.2"
tensorflow = ">=2.18.0"
llms-from-scratch = { path = ".", editable = true } 

# ==========================================
# EXTENDED MACHINE LEARNING TOOLING (BONUS)
# ==========================================
[feature.bonus.dependencies]
scikit-learn = ">=1.3.1"
ipywidgets = ">=8.1.2"

[feature.bonus.pypi-dependencies]
blobfile = ">=3.0.0"
huggingface_hub = ">=0.34.4"
openai = ">=1.30.3"
sentencepiece = ">=0.1.99"
transformers = ">=5.0.0"
thop = "*"
tokenizers = ">=0.21.1"

# ==========================================
# ENVIRONMENTS & TASK ORCHESTRATION
# ==========================================
[environments]
default = { features = ["dev"], no-default-feature = false }
bonus = { features = ["dev", "bonus"], no-default-feature = false }

[tasks]